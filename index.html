<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Issue Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<style>
:root{
  /* บอกเบราว์เซอร์ว่าหน้านี้คุมธีมเอง ไม่งั้น Chrome auto dark mode
     จะบังคับกลับสีให้ ทำให้น้ำเงินเพี้ยนเป็นม่วง */
  color-scheme:light;
  --bg:#F6F8FC; --surface:#FFFFFF; --surface-2:#F9FBFE;
  --border:#E5E9F3; --border-2:#D4DAEA;
  --text:#334066; --heading:#1B2547; --muted:#6E7899; --faint:#9AA4C2;
  --side:#1A3FB8; --side-ink:#FFFFFF; --side-muted:#A9C0F5; --side-hover:rgba(255,255,255,.12); --side-active:#3468EE; --side-line:rgba(255,255,255,.16);
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#E9F0FD; --accent-lite:#A9C6FA;
  --bug:#D64545; --bug-bg:#FDECEC;
  --issue:#B7791F; --issue-bg:#FFF5E5;
  --cr:#0A7373; --cr-bg:#E2F2F2;
  --ok:#2E8B57; --ok-bg:#E8F5EE;
  --neutral:#5C6480; --neutral-bg:#EEF1F8;
  --scrim:rgba(27,37,71,.45);
  --shadow:0 18px 44px rgba(27,37,71,.20);
  --font:'Prompt',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
/* ธีมสว่าง (น้ำเงิน-ขาว) เป็นค่าเริ่มต้นเสมอ ไม่ตามค่า dark mode ของเครื่อง
   ใครอยากได้ธีมมืดกดปุ่มสลับที่แถบบน แล้วระบบจะจำไว้ให้ */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F172E; --surface:#16203F; --surface-2:#1D294B;
  --border:#2A3760; --border-2:#3A4A7A;
  --text:#DAE1F2; --heading:#EDF1FA; --muted:#9FADCE; --faint:#7785A8;
  --side:#152449; --side-muted:#93A8DC; --side-hover:rgba(255,255,255,.1); --side-active:#3468EE; --side-line:rgba(255,255,255,.14);
  --accent:#5B9BFF; --accent-ink:#0A1428; --accent-soft:#1B2E55; --accent-lite:#A9C6FA;
  --bug:#EE6F66; --bug-bg:#3D1E22;
  --issue:#DFA84B; --issue-bg:#3A2D14;
  --cr:#34B3B3; --cr-bg:#0B3234;
  --ok:#3FB489; --ok-bg:#10352A;
  --neutral:#9FADCE; --neutral-bg:#22305A;
  --scrim:rgba(5,10,24,.6);
  --shadow:0 18px 44px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{color:var(--heading)}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:var(--side);color:var(--side-ink);padding:25px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;z-index:40}
.logo{font-size:20px;font-weight:600;padding:0 12px 26px;letter-spacing:-.01em}
.logo span{color:var(--accent-lite)}
.menu-title{font-size:11px;color:var(--side-muted);margin:18px 12px 8px;letter-spacing:.06em}
.menu-item{padding:11px 14px;border-radius:8px;margin-bottom:4px;cursor:pointer;color:#D9E2EC;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:4px;border:0;background:none;width:100%;text-align:left;font-weight:400}
.menu-item:hover{background:var(--side-hover);color:#fff}
.menu-item.active{background:var(--side-active);color:#fff;font-weight:500}
.menu-item i{width:25px;display:inline-block;font-style:normal;flex:none}
.store{margin-top:auto;font-size:12px;color:var(--side-muted);padding:14px 12px 0;border-top:1px solid var(--side-line);display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.store i{width:7px;height:7px;border-radius:50%;background:var(--side-muted);margin-top:6px;flex:none}
.store.live i{background:#4ADE80}
.linkout{background:none;border:0;padding:0;margin-top:6px;color:var(--accent-lite);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkout:hover{color:#fff}

/* ---------- shell ---------- */
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px}
.page-title{font-size:20px;font-weight:600;color:var(--heading);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user{display:flex;align-items:center;gap:12px;font-size:14px;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:500;flex:none}
.menu-btn{display:none;border:1px solid var(--border-2);background:var(--surface);border-radius:8px;width:40px;height:40px;padding:0;cursor:pointer;flex:none;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px}
.icon-btn{border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:8px;width:38px;height:38px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none;line-height:1}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{padding:28px;max-width:1560px}
.scrim{display:none}

/* ---------- controls ---------- */
select,input[type=text],input[type=date],input[type=search],input[type=number]{height:40px;border:1px solid var(--border-2);border-radius:7px;padding:0 12px;font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface);min-width:0;font-weight:300}
input[type=file]{font-size:13px;font-weight:300;padding:9px 12px;border:1px solid var(--border-2);border-radius:7px;background:var(--surface);width:100%}
textarea{min-height:100px;border:1px solid var(--border-2);border-radius:7px;padding:10px 12px;font-family:var(--font);font-size:14px;background:var(--surface);color:var(--text);resize:vertical;width:100%;font-weight:300}
select:hover,input:hover,textarea:hover{border-color:var(--faint)}
.btn{height:40px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:7px;padding:0 18px;font-family:var(--font);font-size:14px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn-danger{color:var(--bug);border-color:var(--border-2)}
.btn-danger:hover{border-color:var(--bug);color:var(--bug)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.filter-bar .search{flex:1;min-width:200px}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.kpi-header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi-title{font-size:13px;color:var(--muted)}
.kpi-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;font-style:normal}
.icon-total{background:var(--accent-soft);color:var(--accent)}
.icon-bug{background:var(--bug-bg);color:var(--bug)}
.icon-issue{background:var(--issue-bg);color:var(--issue)}
.icon-cr{background:var(--cr-bg);color:var(--cr)}
.kpi-number{font-size:28px;font-weight:600;margin-top:10px;line-height:1.15;color:var(--heading);font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--muted)}

/* ---------- cards ---------- */
.dashboard-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.card:last-child{margin-bottom:0}
.dashboard-grid .card{margin-bottom:0}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card-title{font-size:16px;font-weight:600;color:var(--heading)}
.card-sub{font-size:12px;color:var(--muted);font-weight:300}
.chartbox{position:relative;width:100%;height:260px}
.chartbox canvas{display:block;width:100%!important;height:100%!important}
.chart-empty,.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;min-height:120px;font-size:13px;color:var(--muted);font-weight:300;text-align:center;padding:24px}
.empty b{color:var(--heading);font-size:16px;font-weight:500}

/* ---------- project overview ---------- */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.project-card{border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:inherit;width:100%}
.project-card:hover{border-color:var(--faint);box-shadow:0 6px 16px rgba(37,99,235,.12)}
.project-name{font-weight:600;font-size:14px;color:var(--heading)}
.project-code{font-size:11px;color:var(--muted)}
.project-count{display:flex;gap:8px;margin-top:15px}
.count-box{flex:1;padding:8px;border-radius:6px;text-align:center;font-size:12px}
.count-box strong{display:block;font-size:18px;font-weight:600}
.bug-box{background:var(--bug-bg);color:var(--bug)}
.issue-box{background:var(--issue-bg);color:var(--issue)}
.cr-box{background:var(--cr-bg);color:var(--cr)}

/* ---------- table ---------- */
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--surface-2);text-align:left;font-size:12px;color:var(--muted);padding:13px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500}
td{padding:13px;border-bottom:1px solid var(--border);font-size:13px;font-weight:300;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.id{font-weight:500;white-space:nowrap;color:var(--heading);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sub-t{display:block;font-size:12px;color:var(--muted)}
.badge{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;display:inline-block}
.badge-Bug{background:var(--bug-bg);color:var(--bug)}
.badge-Issue{background:var(--issue-bg);color:var(--issue)}
.badge-CR{background:var(--cr-bg);color:var(--cr)}
.status{font-size:11px;padding:4px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.status-open{background:var(--neutral-bg);color:var(--neutral)}
.status-progress{background:var(--accent-soft);color:var(--accent)}
.status-resolved{background:var(--ok-bg);color:var(--ok)}
.status-closed{background:var(--neutral-bg);color:var(--faint)}
.priority-critical,.priority-high{color:var(--bug);font-weight:600}
.priority-medium{color:var(--issue);font-weight:600}
.priority-low{color:var(--ok);font-weight:600}
.late{color:var(--bug);font-weight:500}
.rowcount{font-size:12px;color:var(--muted);font-weight:300;margin-bottom:10px}

/* ---------- modal ---------- */
dialog{border:0;border-radius:12px;padding:0;width:min(650px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(31,35,72,.45)}
:root[data-theme="dark"] dialog::backdrop{background:rgba(5,10,24,.62)}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 25px;border-bottom:1px solid var(--border);flex:none}
.close{cursor:pointer;font-size:24px;color:var(--muted);background:none;border:0;line-height:1;padding:0 4px}
.close:hover{color:var(--text)}
.modal-body{padding:22px 25px;overflow-y:auto;flex:1;min-height:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:var(--muted)}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 25px;border-top:1px solid var(--border);flex:none;flex-wrap:wrap}
.modal-footer .left{margin-right:auto}
.hint{font-size:12px;color:var(--muted);font-weight:300}

/* ---------- misc ---------- */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-weight:300}
.mlist li:first-child{border-top:0}
.mlist li span.nm{flex:1;min-width:0}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--neutral-bg);color:var(--neutral);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--heading);color:var(--surface);padding:10px 18px;border-radius:7px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.tools{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- gantt ---------- */
.gantt{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.gantt{--gname:230px}
.g-inner{min-width:760px}
.g-body{position:relative;padding-bottom:22px}
.g-row{display:grid;grid-template-columns:var(--gname) minmax(0,1fr);align-items:stretch;border-top:1px solid var(--border)}
.g-row:first-child{border-top:0}
.g-row.click{cursor:pointer}
.g-row.click:hover{background:var(--surface-2)}
.g-name{padding:10px 14px;font-size:13px;font-weight:300;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.g-name b{font-weight:500;font-size:13.5px;color:var(--heading);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name span{font-size:11.5px;color:var(--muted)}
.g-head{background:var(--surface-2);position:sticky;top:0;z-index:4}
.g-head .g-name{font-size:12px;color:var(--muted);font-weight:500}
.g-months{display:flex;height:100%}
.g-months span{border-left:1px solid var(--border);font-size:11px;color:var(--muted);padding:10px 6px;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.g-months span:first-child{border-left:0}
.g-track{position:relative;height:42px}
.g-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.g-grid i{border-left:1px solid var(--border);box-sizing:border-box}
.g-grid i:first-child{border-left:0}
.g-bar{position:absolute;top:11px;height:20px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;min-width:3px}
.g-bar.late{background:var(--bug-bg);border-color:var(--bug)}
.g-bar.done{background:var(--ok-bg);border-color:var(--ok)}
.g-fill{height:100%;background:var(--accent);opacity:.85}
.g-bar.late .g-fill{background:var(--bug)}
.g-bar.done .g-fill{background:var(--ok)}
.g-lab{position:absolute;top:13px;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:7px}
.g-ms{position:absolute;top:0;height:100%;display:flex;align-items:center;transform:translateX(-50%);z-index:2}
.g-ms i{width:14px;height:14px;background:var(--issue);transform:rotate(45deg);display:block;box-shadow:0 0 0 2px var(--surface)}
.g-ms.done i{background:var(--ok)}
.g-today{position:absolute;top:0;bottom:22px;width:2px;background:var(--bug);z-index:3;pointer-events:none}
.g-today b{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:500;color:var(--bug);white-space:nowrap;background:var(--surface);padding:0 5px}
.plan-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.plan-sum div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.plan-sum span{font-size:12px;color:var(--muted);display:block}
.plan-sum b{display:block;font-size:22px;font-weight:600;color:var(--heading);margin-top:6px;line-height:1.2}
.plan-sum b.warn{color:var(--bug)}
.pbar{height:7px;border-radius:4px;background:var(--neutral-bg);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;background:var(--accent)}
.g-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);font-weight:300;margin-top:12px}
.g-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.g-legend i.ms{transform:rotate(45deg);width:10px;height:10px;border-radius:0;background:var(--issue)}

/* ---------- auth screen ---------- */
.auth-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
/* จำเป็น: display:flex บรรทัดบนมี specificity เท่ากับ [hidden]{display:none}
   ของเบราว์เซอร์ แต่มาทีหลังจึงชนะ ทำให้หน้า login โผล่ตลอดแม้ไม่ได้สั่งแสดง */
.auth-screen[hidden]{display:none}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-logo{font-size:22px;font-weight:600;color:var(--accent);letter-spacing:-.01em;text-align:center;margin-bottom:4px}
.auth-logo span{color:var(--heading)}
.auth-card label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.auth-card input{height:42px}
.auth-card .btn{height:42px;margin-top:6px}
.auth-msg{font-size:13px;font-weight:300;min-height:20px;text-align:center}
.auth-msg.err{color:var(--bug)}
.auth-foot{font-size:12px;color:var(--muted);font-weight:300;text-align:center;line-height:1.5}
body.locked{overflow:hidden}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}
@media (max-width:1000px){
  .sidebar{transform:translateX(-105%);transition:transform .22s ease;width:min(280px,84vw);padding-top:calc(25px + env(safe-area-inset-top,0px))}
  body.nav-open .sidebar{transform:none;box-shadow:var(--shadow)}
  .scrim{display:block;position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-flex}
  .main{margin-left:0}
  .topbar{padding:0 16px;height:64px}
  .content{padding:18px 16px 56px}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi-number{font-size:24px}
  .kpi-icon{width:32px;height:32px;font-size:15px}
  .page-title{font-size:17px}
  .user span{display:none}
  .filter-bar>*{flex:1 1 100%}
  .form-grid{grid-template-columns:1fr}
  select,input[type=text],input[type=date],input[type=search],input[type=number],textarea{font-size:16px}
  dialog{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;margin:0}
  .modal-header{padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .modal-footer{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .modal-footer .btn{flex:1}
  .modal-footer .left{flex:0 0 auto}
  /* table -> cards */
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block}
  .rt tr{padding:12px 0;border-bottom:1px solid var(--border)}
  .rt tr:last-child{border-bottom:0}

<script>
/* ============ Supabase config ============
   กรอก 2 ค่านี้จาก Supabase > Project Settings > API
   ปล่อยว่าง = ใช้ localStorage ของเครื่องตัวเอง (ข้อมูลไม่แชร์)
   anon key เปิดเผยได้ตามปกติ ความปลอดภัยอยู่ที่ RLS + ต้อง login เท่านั้น */
const SUPA_URL='https://guzkhxvaopsjvvtigbab.supabase.co';
const SUPA_KEY='sb_publishable_4HzEJPptmFOAdK3f0pDbug_Gq2ixhb4';

/* ============ constants ============ */
const LS='issue-tracker-v1';
const COLS=['projects','issues','members','tasks'];
const S={projects:[],issues:[],members:[],tasks:[]};

const TYPES={
  Bug:{label:'Bug',sub:'Defect / Error',icon:'●',pre:'BUG'},
  Issue:{label:'Issue',sub:'Problem / Support',icon:'!',pre:'ISS'},
  CR:{label:'Change Request',sub:'Requirement Change',icon:'↻',pre:'CR'}
};
const TKEYS=['Bug','Issue','CR'];
const STATUS={open:'Open',progress:'In Progress',resolved:'Resolved',closed:'Closed'};
const PRI={critical:'Critical',high:'High',medium:'Medium',low:'Low'};
const PRIORDER={critical:0,high:1,medium:2,low:3};
const ENVS=['DEV','UAT','PROD'];
const ROLES={ba:'BA',dev:'Developer',tester:'Tester',support:'Support',pm:'PM'};

const ROUTES={
  '/dashboard':{title:'Issue Dashboard',view:()=>vDashboard()},
  '/issues':{title:'All Issues',view:()=>vIssues()},
  '/plan':{title:'Project Plan',view:()=>vPlan()},
  '/projects':{title:'Projects',view:()=>vProjects()},
  '/users':{title:'Users',view:()=>vUsers()},
  '/settings':{title:'Settings',view:()=>vSettings()}
};
const UI={year:'all',proj:'all',type:'all',q:'',status:'all',pri:'all',planProj:'all'};
let DB=null,loaded=true;
let SB=null,SBUSER=null;   /* client และผู้ใช้ที่ login อยู่ เมื่อใช้ Supabase */

/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=v=>{if(!v)return '—';const x=new Date(v+'T00:00:00');if(isNaN(x))return v;
  return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear()};
const proj=id=>S.projects.find(p=>p.id===id);
const pName=id=>{const p=proj(id);return p?p.name:'—'};
const pCode=id=>{const p=proj(id);return p&&p.code?p.code:'—'};
const mName=id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'—'};
const sortedProjs=()=>[...S.projects].sort((a,b)=>String(a.code||'~').localeCompare(String(b.code||'~'),'th',{numeric:true}));
const sortedMembers=()=>[...S.members].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));
const isLate=i=>i.due&&i.due<today()&&i.status!=='resolved'&&i.status!=='closed';
const isOpen=i=>i.status!=='closed'&&i.status!=='resolved';
const hasAny=()=>S.projects.length||S.issues.length||S.members.length;

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
function opts(list,sel,empty){return (empty!==undefined?`<option value="">${esc(empty)}</option>`:'')+
  list.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(sel)?' selected':''}>${esc(o.t)}</option>`).join('')}
const dictOpts=(d,sel,empty)=>opts(Object.entries(d).map(([v,t])=>({v,t})),sel,empty);
const projOpts=(sel,empty)=>opts(sortedProjs().map(p=>({v:p.id,t:(p.code?p.code+' · ':'')+p.name})),sel,empty);
const memberOpts=(sel,empty)=>opts(sortedMembers().map(m=>({v:m.id,t:m.name})),sel,empty);
const typeOpts=(sel,empty)=>opts(TKEYS.map(k=>({v:k,t:TYPES[k].label})),sel,empty);
const envOpts=sel=>opts(ENVS.map(e=>({v:e,t:e})),sel);

function years(){
  const ys=new Set(S.issues.map(i=>String(i.created||'').slice(0,4)).filter(Boolean));
  ys.add(String(new Date().getFullYear()));
  return [...ys].sort();
}
function nextCode(type){
  const y=new Date().getFullYear();
  const pre=TYPES[type].pre+'-'+y+'-';
  const n=S.issues.filter(i=>String(i.code||'').startsWith(pre))
    .map(i=>parseInt(String(i.code).slice(pre.length),10)).filter(x=>!isNaN(x));
  return pre+String((n.length?Math.max(...n):0)+1).padStart(5,'0');
}

/* ============ storage ============ */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function errMsg(e){
  if(e&&e.code==='quota_exceeded')return 'พื้นที่เก็บข้อมูลเต็ม ลบรายการที่ไม่ใช้ก่อนแล้วลองอีกครั้ง';
  if(e&&e.code==='invalid_argument')return 'คุณไม่มีสิทธิ์แก้ไขข้อมูลนี้ หรือข้อมูลไม่ถูกต้อง';
  if(e&&e.code==='resource_exhausted')return 'ทำรายการถี่เกินไป รอสักครู่แล้วลองใหม่';
  return 'บันทึกไม่สำเร็จ ลองอีกครั้ง';
}
function sbErr(e){
  const m=String((e&&e.message)||'');
  /* PGRST205 = PostgREST มองไม่เห็นตาราง แปลว่ายังไม่ได้รัน supabase-setup.sql */
  if((e&&e.code==='PGRST205')||/schema cache/i.test(m))
    return 'ฐานข้อมูลยังไม่มีตารางนี้ ต้องรัน supabase-setup.sql ใน Supabase ก่อน';
  if(/row-level security|violates row-level/i.test(m))return 'คุณไม่มีสิทธิ์แก้ข้อมูลนี้';
  if(/JWT|token|session/i.test(m))return 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
  if(/Failed to fetch|NetworkError/i.test(m))return 'ต่อฐานข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';
  return 'บันทึกไม่สำเร็จ: '+(m||'ไม่ทราบสาเหตุ');
}
async function put(col,obj){
  if(DB){const {id,...body}=obj;try{await DB.collection(col).doc(id).set(body)}catch(e){toast(errMsg(e));throw e}}
  else if(SB){
    const {id,...body}=obj;
    const {error}=await SB.from(col).upsert({id,data:body});
    if(error){toast(sbErr(error));throw error}
    /* อัปเดตในหน่วยความจำทันที ไม่รอ realtime เพื่อให้หน้าจอตอบสนองเร็ว */
    const a=S[col],i=a.findIndex(x=>x.id===obj.id);
    if(i>=0)a[i]=obj;else a.push(obj);
    render();
  }
  else{const a=S[col],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);saveLocal();render()}
}
async function del(col,id){
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){toast(errMsg(e));throw e}}
  else if(SB){
    const {error}=await SB.from(col).delete().eq('id',id);
    if(error){toast(sbErr(error));throw error}
    S[col]=S[col].filter(x=>x.id!==id);render();
  }
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}
/* แถวใน Supabase เก็บเป็น {id, data} โดย data คือตัว object เดิมทั้งก้อน
   จึงแปลงกลับเป็นรูปเดียวกับที่ทุก view ใช้อยู่ */
async function sbLoad(col){
  const {data,error}=await SB.from(col).select('id,data');
  if(error){toast(sbErr(error));return false}
  S[col]=(data||[]).map(r=>({id:r.id,...(r.data||{})}));
  return true;
}
async function sbLoadAll(){await Promise.all(COLS.map(sbLoad));loaded=true;render()}

/* ============ routing ============ */
const ICON={dash:'▦',issues:'☷',plan:'▤',create:'＋',proj:'▣',users:'◉',settings:'⚙'};
function route(){const r=(location.hash||'#/dashboard').slice(1);return ROUTES[r]?r:'/dashboard'}
function renderNav(r){
  const a=(h,t,ic)=>`<a href="#${h}" class="menu-item${r===h?' active':''}"><i>${ic}</i>${t}</a>`;
  $('#nav').innerHTML=
    `<div class="menu-title">MAIN</div>`+
    a('/dashboard','Dashboard',ICON.dash)+
    a('/issues','All Issues',ICON.issues)+
    a('/plan','Project Plan',ICON.plan)+
    `<button type="button" class="menu-item" onclick="editIssue()"><i>${ICON.create}</i>Create Issue</button>`+
    `<div class="menu-title">MANAGEMENT</div>`+
    a('/projects','Projects',ICON.proj)+
    a('/users','Users',ICON.users)+
    a('/settings','Settings',ICON.settings);
}
function render(){
  const r=route();renderNav(r);
  $('#pageTitle').textContent=ROUTES[r].title;
  const el=$('#content');
  const focusId=document.activeElement&&el.contains(document.activeElement)?document.activeElement.id:null;
  const pos=focusId&&document.activeElement.selectionStart;
  CH.length=0;
  el.innerHTML=ROUTES[r].view();
  mountCharts();
  if(focusId){const f=document.getElementById(focusId);if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(e){}}}
}
function setNav(open){document.body.classList.toggle('nav-open',open);$('#menuBtn').setAttribute('aria-expanded',open)}
window.addEventListener('hashchange',()=>{setNav(false);render();window.scrollTo(0,0)});
$('#menuBtn').onclick=()=>setNav(!document.body.classList.contains('nav-open'));
$('#scrim').onclick=()=>setNav(false);
$('#nav').addEventListener('click',e=>{if(e.target.closest('a,button'))setNav(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open'))setNav(false)});

/* ============ charts ============ */
const CH=[];let chartOn=[];
function chartSlot(build,h){const id='chart-'+CH.length;CH.push({id,build});
  return `<div class="chartbox"${h?` style="height:${h}px"`:''}><canvas id="${id}"></canvas></div>`}
function mountCharts(){
  chartOn.forEach(c=>{try{c.destroy()}catch(e){}});chartOn=[];
  if(!CH.length||!window.Chart)return;
  const cs=getComputedStyle(document.documentElement);
  const V=n=>cs.getPropertyValue('--'+n).trim();
  Chart.defaults.font.family=V('font')||'sans-serif';
  Chart.defaults.font.size=12;
  Chart.defaults.font.weight=300;
  Chart.defaults.color=V('muted');
  for(const {id,build} of CH){
    const el=document.getElementById(id);if(!el)continue;
    const cfg=build(V);
    if(!cfg){el.parentNode.innerHTML='<div class="chart-empty">ยังไม่มีข้อมูลพอจะแสดงกราฟ</div>';continue}
    cfg.options={responsive:true,maintainAspectRatio:false,...cfg.options};
    try{chartOn.push(new Chart(el,cfg))}catch(e){}
  }
}
const legendBottom={position:'bottom',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle',padding:14}};
function doughnut(labels,data,colors){
  return V=>{
    const sum=data.reduce((s,n)=>s+n,0);
    if(!sum)return null;
    return {type:'doughnut',
      data:{labels,datasets:[{data,backgroundColor:colors.map(c=>V(c)),borderColor:V('surface'),borderWidth:2,hoverOffset:6}]},
      options:{cutout:'70%',plugins:{legend:legendBottom,
        tooltip:{callbacks:{label:c=>' '+c.label+': '+c.raw+' ('+Math.round(c.raw/sum*100)+'%)'}}}}};
  };
}
function barChart(labels,sets,opt={}){
  return V=>{
    if(!labels.length||!sets.some(d=>d.data.some(n=>n>0)))return null;
    const line=V('border'),muted=V('muted');
    const valAx={beginAtZero:true,stacked:!!opt.stacked,grid:{color:line},border:{display:false},ticks:{color:muted,precision:0}};
    const catAx={stacked:!!opt.stacked,grid:{display:false},border:{display:false},ticks:{color:muted,autoSkip:false,
      callback(v){const s=String(this.getLabelForValue(v));return s.length>22?s.slice(0,21)+'…':s}}};
    return {type:'bar',
      data:{labels,datasets:sets.map(d=>({label:d.label,data:d.data,
        backgroundColor:d.colors?d.colors.map(c=>V(c)):V(d.color),
        borderRadius:4,borderSkipped:false,maxBarThickness:opt.horiz?16:44}))},
      options:{indexAxis:opt.horiz?'y':'x',
        plugins:{legend:sets.length>1?legendBottom:{display:false}},
        scales:opt.horiz?{x:valAx,y:catAx}:{x:catAx,y:valAx}}};
  };
}

/* ============ filtering ============ */
function filtered(o={}){
  const q=UI.q.trim().toLowerCase();
  return S.issues.filter(i=>
    (o.ignoreYear||UI.year==='all'||String(i.created||'').slice(0,4)===UI.year)&&
    (UI.proj==='all'||i.projectId===UI.proj)&&
    (UI.type==='all'||i.type===UI.type)&&
    (o.ignoreStatus||UI.status==='all'||i.status===UI.status)&&
    (o.ignorePri||UI.pri==='all'||i.priority===UI.pri)&&
    (!q||[i.code,i.title,pName(i.projectId),pCode(i.projectId),i.desc,mName(i.assigneeId)].join(' ').toLowerCase().includes(q)));
}
function filterBar(extra){
  const ys=years();
  return `<div class="filter-bar">
    <select id="fYear" aria-label="ปี" onchange="UI.year=this.value;render()">${opts(ys.map(y=>({v:y,t:y})),UI.year,'ทุกปี')}</select>
    <select id="fProj" aria-label="Project" onchange="UI.proj=this.value;render()">${projOpts(UI.proj,'ทุก Project')}</select>
    <select id="fType" aria-label="ประเภท" onchange="UI.type=this.value;render()">${typeOpts(UI.type,'ทุกประเภท')}</select>
    ${extra||''}
    <input class="search" type="search" id="fQ" placeholder="ค้นหา Issue ID / ชื่อ Issue / Project..." value="${esc(UI.q)}" oninput="UI.q=this.value;render()">
    <button class="btn btn-primary" onclick="editIssue()">+ เพิ่ม Issue</button>
  </div>`;
}
const sortNewest=(a,b)=>String(b.created||'').localeCompare(String(a.created||''))||String(b.code||'').localeCompare(String(a.code||''),undefined,{numeric:true});

/* ============ shared pieces ============ */
function issueRows(list){
  return list.map(i=>`<tr class="click" onclick="editIssue('${i.id}')">
    <td class="id" data-label="ID">#${esc(i.code||'—')}</td>
    <td data-label="Type"><span class="badge badge-${esc(i.type)}">${esc(TYPES[i.type]?TYPES[i.type].label==='Change Request'?'CR':TYPES[i.type].label:i.type)}</span></td>
    <td data-label="Project">${esc(pCode(i.projectId))}</td>
    <td class="lead" data-label="Issue">${esc(i.title)}</td>
    <td data-label="Priority" class="priority-${esc(i.priority)}">${esc(PRI[i.priority]||'—')}</td>
    <td data-label="Assignee">${esc(i.assigneeId?mName(i.assigneeId):'—')}</td>
    <td data-label="Status"><span class="status status-${esc(i.status)}">${esc(STATUS[i.status]||'—')}</span></td>
    <td data-label="Due Date" class="${isLate(i)?'late':''}" style="white-space:nowrap">${fmtD(i.due)}</td></tr>`).join('');
}
const ISSUE_HEAD='<tr><th>ID</th><th>Type</th><th>Project</th><th>Issue</th><th>Priority</th><th>Assignee</th><th>Status</th><th>Due Date</th></tr>';
function emptyState(title,msg,btn){
  return `<div class="card"><div class="empty"><b>${esc(title)}</b><span>${esc(msg)}</span>${btn?`<div class="tools" style="margin-top:12px">${btn}</div>`:''}</div></div>`;
}

/* ============ Dashboard ============ */
function vDashboard(){
  let h=filterBar();
  if(!hasAny())return h+emptyState('ยังไม่มีข้อมูลในระบบ','เริ่มจากสร้าง Project แล้วบันทึก Issue หรือโหลดข้อมูลตัวอย่างเพื่อดูการทำงาน',
    `<a class="btn" href="#/projects">ไปที่ Projects</a>${loaded?'<button class="btn btn-primary" onclick="seed()">โหลดข้อมูลตัวอย่าง</button>':''}`);

  const list=filtered();
  const cnt=t=>list.filter(i=>i.type===t).length;
  const yearLabel=UI.year==='all'?'ทุกปี':'ปี '+UI.year;
  const kpi=(cls,icon,title,n,sub)=>`<div class="kpi"><div class="kpi-header"><div class="kpi-title">${esc(title)}</div><div class="kpi-icon ${cls}">${icon}</div></div><div class="kpi-number">${n}</div><div class="kpi-sub">${esc(sub)}</div></div>`;
  h+=`<div class="kpi-grid">
    ${kpi('icon-total','◉','Total Issues',list.length,'รายการทั้งหมดใน'+yearLabel)}
    ${kpi('icon-bug','●','Bug',cnt('Bug'),TYPES.Bug.sub)}
    ${kpi('icon-issue','!','Issue',cnt('Issue'),TYPES.Issue.sub)}
    ${kpi('icon-cr','↻','Change Request',cnt('CR'),TYPES.CR.sub)}
  </div>`;

  /* Issue Trend ไม่สนตัวกรองปี เพราะกราฟนี้คือการเทียบข้ามปี */
  const trend=filtered({ignoreYear:true});
  const ys=years().filter(y=>trend.some(i=>String(i.created||'').slice(0,4)===y)||y===String(new Date().getFullYear()));
  h+=`<div class="dashboard-grid">
    <div class="card"><div class="card-header"><div><div class="card-title">Issue Trend</div><div class="card-sub">จำนวน Bug / Issue / CR แยกตามปี (ไม่สนตัวกรองปี)</div></div></div>
      ${chartSlot(barChart(ys,TKEYS.map(t=>({label:TYPES[t].label==='Change Request'?'CR':TYPES[t].label,color:t==='Bug'?'bug':t==='Issue'?'issue':'cr',
        data:ys.map(y=>trend.filter(i=>i.type===t&&String(i.created||'').slice(0,4)===y).length)}))),230)}</div>
    <div class="card"><div class="card-header"><div><div class="card-title">Issue Distribution</div><div class="card-sub">${esc(yearLabel)}</div></div></div>
      ${chartSlot(doughnut(['Bug','Issue','CR'],TKEYS.map(t=>cnt(t)),['bug','issue','cr']),230)}</div>
  </div>`;

  const projs=sortedProjs().filter(p=>list.some(i=>i.projectId===p.id));
  h+=`<div class="card"><div class="card-header"><div><div class="card-title">Project Overview</div><div class="card-sub">จำนวนรายการแยกตาม Project</div></div>

/* ============ Project Plan (Gantt) ============
   งานในแผนเก็บแยกจาก issues โดยตั้งใจ เพราะแผนงานคือเฟสที่มีวันเริ่ม-วันจบ-%คืบหน้า
   ส่วน issue มีแค่กำหนดเสร็จ วาดเป็นแท่งเวลาไม่ได้ */
const DAY=86400000;
const dparse=v=>{if(!v)return null;const d=new Date(v+'T00:00:00');return isNaN(d)?null:d};
const daysBetween=(a,b)=>Math.round((b-a)/DAY);
const todayD=()=>dparse(today());
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isMs=t=>!!t.milestone;
const tStart=t=>dparse(t.start);
const tEnd=t=>dparse(isMs(t)?t.start:(t.end||t.start));
const tValid=t=>{const a=tStart(t),b=tEnd(t);return !!(a&&b&&b>=a)};
const projTasks=pid=>S.tasks.filter(t=>t.projectId===pid&&tValid(t))
  .sort((a,b)=>tStart(a)-tStart(b)||(isMs(a)?1:0)-(isMs(b)?1:0)||String(a.name||'').localeCompare(String(b.name||''),'th'));

/* ช่วงเวลาของกราฟ ขยายให้เต็มเดือนหัวท้าย เพื่อให้หัวตารางเดือนอ่านง่าย */
function planRange(items){
  const ds=[];
  items.forEach(t=>{const a=tStart(t),b=tEnd(t);if(a&&b){ds.push(+a);ds.push(+b)}});
  if(!ds.length)return null;
  const lo=new Date(Math.min.apply(null,ds)),hi=new Date(Math.max.apply(null,ds));
  const min=new Date(lo.getFullYear(),lo.getMonth(),1);
  const max=new Date(hi.getFullYear(),hi.getMonth()+1,0);
  return {min,max,days:daysBetween(min,max)+1};
}
function monthCells(r){
  const out=[];
  let cur=new Date(r.min.getFullYear(),r.min.getMonth(),1);
  while(cur<=r.max){
    const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    const to=mEnd>r.max?r.max:mEnd;
    const from=cur<r.min?r.min:cur;
    out.push({label:cur.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}),
      pct:(daysBetween(from,to)+1)/r.days*100});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out;
}
const pctAt=(r,d)=>daysBetween(r.min,d)/r.days*100;
const gridHTML=cells=>`<div class="g-grid">${cells.map(c=>`<i style="width:${c.pct}%"></i>`).join('')}</div>`;
/* เส้นวันนี้เส้นเดียวพาดทุกแถว วางบน .g-body ไม่ใช่ในแต่ละแถว
   ตำแหน่งอ้าง --gname เพื่อข้ามคอลัมน์ชื่องานให้ตรงกับพื้นที่เวลาเสมอ */
function todayLine(r){
  const t=todayD();
  if(t<r.min||t>r.max)return '';
  const frac=(daysBetween(r.min,t)/r.days).toFixed(5);
  return `<div class="g-today" style="left:calc(var(--gname) + (100% - var(--gname)) * ${frac})"><b>วันนี้</b></div>`;
}
/* คืบหน้ารวม ถ่วงน้ำหนักด้วยจำนวนวันของแต่ละงาน ไม่นับ milestone ที่ไม่กินเวลา */
function overallProgress(items){
  let tot=0,acc=0;
  items.filter(t=>!isMs(t)).forEach(t=>{
    const d=daysBetween(tStart(t),tEnd(t))+1;
    tot+=d;acc+=d*Math.min(100,Math.max(0,num(t.progress)))/100;
  });
  return tot?Math.round(acc/tot*100):0;
}
const taskLate=t=>!isMs(t)&&tEnd(t)<todayD()&&num(t.progress)<100;
const msLate=t=>isMs(t)&&tStart(t)<todayD()&&num(t.progress)<100;
const anyLate=ts=>ts.some(t=>taskLate(t)||msLate(t));

function barHTML(r,t){
  const a=tStart(t),b=tEnd(t);
  const left=pctAt(r,a);
  const done=num(t.progress)>=100;
  if(isMs(t)){
    return `<div class="g-ms${done?' done':''}" style="left:${left}%" title="${esc(t.name)} · ${fmtD(t.start)}"><i></i></div>
      <div class="g-lab" style="left:${left}%">${esc(t.name)}</div>`;
  }
  const w=(daysBetween(a,b)+1)/r.days*100;
  const cls=done?'done':(taskLate(t)?'late':'');
  const pg=Math.min(100,Math.max(0,num(t.progress)));
  return `<div class="g-bar ${cls}" style="left:${left}%;width:${w}%" title="${esc(t.name)} · ${fmtD(t.start)} – ${fmtD(t.end||t.start)} · ${pg}%">
      <div class="g-fill" style="width:${pg}%"></div></div>
    <div class="g-lab" style="left:${left+w}%">${pg}%</div>`;
}
const monthHead=(label,cells,r)=>`<div class="g-row g-head"><div class="g-name">${esc(label)}</div><div class="g-track" style="height:auto"><div class="g-months">${cells.map(c=>`<span style="width:${c.pct}%">${esc(c.label)}</span>`).join('')}</div></div></div>`;
const ganttLegend=extra=>`<div class="g-legend"><span><i style="background:var(--accent)"></i>ตามแผน</span><span><i style="background:var(--bug)"></i>ล่าช้า</span><span><i style="background:var(--ok)"></i>เสร็จแล้ว</span>${extra||''}</div>`;

function vPlan(){
  let h=`<div class="filter-bar">
    <select id="planProj" aria-label="เลือก Project" onchange="UI.planProj=this.value;render()">${projOpts(UI.planProj,'ทุก Project (ภาพรวม)')}</select>
    <div style="flex:1"></div>
    <button class="btn btn-primary" onclick="editTask()">+ เพิ่มงานในแผน</button>
  </div>`;

  if(!S.projects.length)return h+emptyState('ยังไม่มี Project','สร้าง Project ก่อน แล้วจึงวางแผนงานได้','<a class="btn btn-primary" href="#/projects">ไปที่ Projects</a>');

  /* ภาพรวม: หนึ่งแถวต่อหนึ่งโครงการ ย่อจากงานทั้งหมดในโครงการนั้น */
  if(UI.planProj==='all'){
    const rows=sortedProjs().map(p=>{
      const ts=projTasks(p.id);
      if(!ts.length)return null;
      return {p,ts,start:tStart(ts[0]),end:new Date(Math.max.apply(null,ts.map(t=>+tEnd(t)))),prog:overallProgress(ts)};
    }).filter(Boolean);
    if(!rows.length)return h+emptyState('ยังไม่มีแผนงาน','เลือก Project แล้วเพิ่มงานเข้าไป ระบบจะวาด Gantt ให้อัตโนมัติ','<button class="btn btn-primary" onclick="editTask()">+ เพิ่มงานในแผน</button>');
    const all=[];rows.forEach(x=>x.ts.forEach(t=>all.push(t)));
    const r=planRange(all),cells=monthCells(r);
    const lateN=rows.filter(x=>anyLate(x.ts)).length;
    h+=`<div class="plan-sum">
      <div><span>โครงการที่มีแผน</span><b>${rows.length}</b></div>
      <div><span>ความคืบหน้าเฉลี่ย</span><b>${Math.round(rows.reduce((s,x)=>s+x.prog,0)/rows.length)}%</b></div>
      <div><span>โครงการที่มีงานล่าช้า</span><b class="${lateN?'warn':''}">${lateN}</b></div>
    </div>`;
    h+=`<div class="card" style="padding:0;overflow:hidden"><div class="gantt"><div class="g-inner">`+monthHead('Project',cells,r)+`<div class="g-body">`+todayLine(r);
    for(const x of rows){
      const left=pctAt(r,x.start),w=(daysBetween(x.start,x.end)+1)/r.days*100;
      const cls=anyLate(x.ts)?'late':(x.prog>=100?'done':'');
      h+=`<div class="g-row click" onclick="UI.planProj='${x.p.id}';render()">
        <div class="g-name"><b>${esc(x.p.name)}</b><span>${esc(x.p.code||'—')} · ${x.ts.length} งาน</span></div>
        <div class="g-track">${gridHTML(cells)}
          <div class="g-bar ${cls}" style="left:${left}%;width:${w}%" title="${esc(x.p.name)} · ${x.prog}%"><div class="g-fill" style="width:${x.prog}%"></div></div>
          <div class="g-lab" style="left:${left+w}%">${x.prog}%</div></div></div>`;
    }
    return h+`</div></div></div></div>`+ganttLegend('<span>คลิกแถวเพื่อดูแผนรายโครงการ</span>');
  }

  /* รายโครงการ */
  const p=proj(UI.planProj);
  if(!p)return h+emptyState('ไม่พบ Project นี้','อาจถูกลบไปแล้ว เลือกใหม่จากรายการด้านบน');
  const ts=projTasks(p.id);
  const bad=S.tasks.filter(t=>t.projectId===p.id&&!tValid(t)).length;
  if(!ts.length)return h+emptyState('ยังไม่มีแผนงานใน '+p.name,
    bad?`มี ${bad} รายการที่วันที่ไม่ครบหรือวันจบมาก่อนวันเริ่ม จึงยังวาดไม่ได้`
       :'เพิ่มงานแรกเข้าไป เช่น วิเคราะห์ความต้องการ / ออกแบบ / พัฒนา / UAT / Go-live',
    '<button class="btn btn-primary" onclick="editTask()">+ เพิ่มงานในแผน</button>');

  const r=planRange(ts),cells=monthCells(r);
  const end=new Date(Math.max.apply(null,ts.map(t=>+tEnd(t))));
  const prog=overallProgress(ts);
  const lateN=ts.filter(t=>taskLate(t)||msLate(t)).length;
  const remain=daysBetween(todayD(),end);
  const nextMs=ts.filter(t=>isMs(t)&&tStart(t)>=todayD())[0];

  h+=`<div class="plan-sum">
    <div><span>ช่วงเวลาโครงการ</span><b style="font-size:15px">${fmtD(ts[0].start)}<br>ถึง ${fmtD(ymd(end))}</b></div>
    <div><span>ความคืบหน้ารวม</span><b>${prog}%</b><div class="pbar"><i style="width:${prog}%"></i></div></div>
    <div><span>${remain>=0?'เหลืออีก':'เลยกำหนดมาแล้ว'}</span><b class="${remain<0?'warn':''}">${Math.abs(remain)} วัน</b></div>
    <div><span>งานล่าช้า</span><b class="${lateN?'warn':''}">${lateN}</b></div>
    <div><span>หมุดถัดไป</span><b style="font-size:14px">${nextMs?esc(nextMs.name)+'<br><span style="font-size:12px;font-weight:400;color:var(--muted)">'+fmtD(nextMs.start)+'</span>':'—'}</b></div>
  </div>`;

  h+=`<div class="card" style="padding:0;overflow:hidden"><div class="gantt"><div class="g-inner">`+monthHead('งาน',cells,r)+`<div class="g-body">`+todayLine(r);
  for(const t of ts){
    h+=`<div class="g-row click" onclick="editTask('${t.id}')">
      <div class="g-name"><b>${isMs(t)?'◆ ':''}${esc(t.name)}</b><span>${fmtD(t.start)}${isMs(t)?'':' – '+fmtD(t.end||t.start)}</span></div>
      <div class="g-track">${gridHTML(cells)}${barHTML(r,t)}</div></div>`;
  }
  h+=`</div></div></div></div>`+ganttLegend('<span><i class="ms"></i>Milestone</span><span>คลิกแถวเพื่อแก้ไข</span>');
  if(bad)h+=`<div class="rowcount" style="margin-top:10px">ซ่อน ${bad} รายการที่วันที่ไม่ครบหรือวันจบมาก่อนวันเริ่ม</div>`;
  return h;
}

function editTask(id){
  if(!S.projects.length){toast('สร้าง Project ก่อน แล้วจึงวางแผนงาน');location.hash='#/projects';return}
  const cur=id?S.tasks.find(x=>x.id===id):null;
  if(id&&!cur){toast('ไม่พบงานนี้แล้ว');return}
  const t=cur?{...cur}:{projectId:(UI.planProj!=='all'&&UI.planProj)||sortedProjs()[0].id,
    start:today(),end:today(),progress:0,milestone:false};
  modal(cur?'แก้ไขงานในแผน':'เพิ่มงานในแผน',`<div class="form-grid">
    <div class="form-group"><label>Project</label><select data-f="projectId">${projOpts(t.projectId)}</select></div>
    <div class="form-group"><label>ประเภท</label><select data-f="kind" id="tKind">${opts([{v:'task',t:'งาน (แท่งเวลา)'},{v:'ms',t:'Milestone (หมุดสำคัญ)'}],isMs(t)?'ms':'task')}</select></div>
    <div class="form-group full"><label>ชื่องาน</label><input type="text" data-f="name" value="${esc(t.name)}" placeholder="เช่น วิเคราะห์ความต้องการ / UAT / Go-live"></div>
    <div class="form-group"><label>วันเริ่ม</label><input type="date" data-f="start" value="${esc(t.start)}"></div>
    <div class="form-group" id="tEndBox"><label>วันสิ้นสุด</label><input type="date" data-f="end" value="${esc(t.end)}"></div>
    <div class="form-group"><label>ความคืบหน้า (%)</label><input type="number" min="0" max="100" step="5" data-f="progress" value="${esc(num(t.progress))}"></div>
    <div class="form-group full"><span class="hint">Milestone ใช้วันเดียว ระบบตั้งวันจบให้เท่ากับวันเริ่มเอง</span></div>
  </div>`,
  async f=>{
    if(!f.name.trim()){toast('กรอกชื่องานก่อนบันทึก');return false}
    if(!f.start){toast('เลือกวันเริ่มก่อนบันทึก');return false}
    const ms=f.kind==='ms';
    const end=ms?f.start:(f.end||f.start);
    if(!ms&&end<f.start){toast('วันจบต้องไม่มาก่อนวันเริ่ม');return false}
    const n={...t,...f,id:t.id||uid(),name:f.name.trim(),end,milestone:ms,
      progress:Math.min(100,Math.max(0,num(f.progress)))};
    delete n.kind;
    await put('tasks',n);
    UI.planProj=n.projectId;
    toast('บันทึกแผนงานแล้ว');
  },
  cur?async()=>{
    if(!await confirmBox('ลบ "'+(t.name||'งานนี้')+'"?','ลบแล้วกู้คืนไม่ได้'))return false;
    await del('tasks',id);toast('ลบงานแล้ว');
  }:null,'บันทึก');
  const sync=()=>{$('#tEndBox').style.display=$('#tKind').value==='ms'?'none':''};
  $('#tKind').onchange=sync;sync();
}

    <button class="btn btn-primary" onclick="editProject()">+ เพิ่ม Project</button></div>`;

  const rows=sortedProjs().map(p=>{
    const l=S.issues.filter(i=>i.projectId===p.id);

      <td class="n" data-label="Bug">${c('Bug')}</td><td class="n" data-label="Issue">${c('Issue')}</td><td class="n" data-label="CR">${c('CR')}</td>
      <td class="n" data-label="ทั้งหมด">${l.length}</td>
      <td class="n ${open?'late':''}" data-label="ยังไม่ปิด">${open}</td></tr>`}).join('');
  return h+`<div class="card"><div class="rowcount">${S.projects.length} Project</div><div class="table-wrapper"><table class="rt">
    <thead><tr><th>Code</th><th>Project</th><th>ช่วงเวลา</th><th class="n">Bug</th><th class="n">Issue</th><th class="n">CR</th><th class="n">ทั้งหมด</th><th class="n">ยังไม่ปิด</th></tr></thead>

const inArtifact=()=>!!(window.claude&&typeof window.claude.use==='function');
async function exportJSON(){
  const text=JSON.stringify({app:'issue-tracker',version:1,exported:new Date().toISOString(),
    projects:S.projects,issues:S.issues,members:S.members},null,2);
  const name='issue-tracker-'+today()+'.json';
  /* ในหน้า artifact ลิงก์ <a download> ไม่ทำงาน ต้องบันทึกผ่าน capability downloads
     ส่วนตอนเปิดไฟล์ตรง ๆ ไม่มี capability จึงใช้ลิงก์ตามปกติ */
  if(inArtifact()){
    let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(!dl){toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ ใช้ "คัดลอก JSON" แทน');return}
    try{await dl.save({filename:name,data:text});toast('ส่งออกแล้ว')}
    catch(e){toast(e&&e.code==='declined'?'ยกเลิกการส่งออก':'ส่งออกไม่สำเร็จ ลองอีกครั้ง')}
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('ส่งออกแล้ว');
}
async function copyJSON(){
  const text=JSON.stringify({app:'issue-tracker',version:1,exported:new Date().toISOString(),
    projects:S.projects,issues:S.issues,members:S.members},null,2);
  try{await navigator.clipboard.writeText(text);toast('คัดลอก JSON แล้ว วางเก็บไว้ในไฟล์ได้เลย')}
  catch(e){toast('คัดลอกไม่สำเร็จ เบราว์เซอร์ไม่อนุญาต')}
}
function importJSON(){
  /* รับได้ทั้งไฟล์และการวางข้อความ เพราะบาง sandbox ไม่เปิดหน้าต่างเลือกไฟล์ให้ */
  modal('นำเข้าข้อมูลจาก JSON',`<div class="form-grid">
    <div class="form-group full"><label>เลือกไฟล์ .json</label><input type="file" id="impFile" accept="application/json,.json"></div>
    <div class="form-group full"><label>หรือวางเนื้อหา JSON ที่นี่</label><textarea id="impText" placeholder='{"projects":[...],"issues":[...],"members":[...]}'></textarea></div>
    <div class="form-group full"><span class="hint">รายการที่ id ซ้ำกับของเดิมจะถูกเขียนทับ ส่วนที่เหลือจะถูกเพิ่มเข้าไป</span></div>
  </div>`,
  async()=>{
    const fEl=$('#impFile'),tEl=$('#impText');
    let raw=tEl.value.trim();
    if(!raw&&fEl.files&&fEl.files[0]){try{raw=await fEl.files[0].text()}catch(e){}}
    if(!raw){toast('เลือกไฟล์หรือวาง JSON ก่อน');return false}
    let d;try{d=JSON.parse(raw)}catch(e){toast('อ่าน JSON ไม่ได้ ตรวจรูปแบบอีกครั้ง');return false}
    const got=COLS.filter(c=>Array.isArray(d[c]));
    if(!got.length){toast('ไม่พบ projects / issues / members ในข้อมูลนี้');return false}
    let n=0;
    for(const c of got)for(const row of d[c]){if(!row||!row.id)continue;await put(c,row);n++}
    toast('นำเข้า '+n+' รายการแล้ว');
  },null,'นำเข้า');
}
async function wipeAll(){
  if(!await confirmBox('ล้างข้อมูลทั้งหมด?',(DB?'ข้อมูลในฐานข้อมูลกลางจะถูกลบ มีผลกับทุกคนที่ใช้หน้านี้ ':'')+'ลบแล้วกู้คืนไม่ได้ แนะนำให้ส่งออก JSON เก็บไว้ก่อน'))return;
  for(const c of COLS)for(const row of [...S[c]])await del(c,row.id);
  toast('ล้างข้อมูลแล้ว');
}

/* ============ modal plumbing ============ */
function modal(title,body,onSave,onDelete,saveLabel){
  const d=$('#dlg');
  $('#dlgTitle').textContent=title;
  $('#dlgBody').innerHTML=body;
  $('#dlgFoot').innerHTML=(onDelete?'<button class="btn btn-danger left" id="mDel">ลบ</button>':'')+
    '<button class="btn" id="mCancel">Cancel</button><button class="btn btn-primary" id="mSave">'+esc(saveLabel||'Save')+'</button>';
  $('#mCancel').onclick=()=>d.close();
  $('#mSave').onclick=async()=>{
    const f={};$('#dlgBody').querySelectorAll('[data-f]').forEach(el=>f[el.dataset.f]=el.value);
    const b=$('#mSave');b.disabled=true;
    try{const r=await onSave(f);if(r!==false)d.close()}catch(e){}
    b.disabled=false;
  };
  if(onDelete)$('#mDel').onclick=async()=>{try{const r=await onDelete();if(r!==false)d.close()}catch(e){}};
  d.showModal();
  const first=$('#dlgBody').querySelector('input[type=text]');
  if(first&&!first.value)first.focus();
}
$('#dlgClose').onclick=()=>$('#dlg').close();
function confirmBox(title,msg,okLabel){
  return new Promise(res=>{
    const w=document.createElement('dialog');w.style.width='min(430px,calc(100vw - 24px))';
    w.innerHTML=`<div class="modal-header"><div class="card-title">${esc(title)}</div></div>
      <div class="modal-body">${esc(msg)}</div>
      <div class="modal-footer"><button class="btn" data-a="0">ยกเลิก</button>
      <button class="btn btn-primary" data-a="1" style="background:var(--bug);border-color:var(--bug);color:#fff">${esc(okLabel||'ลบ')}</button></div>`;
    document.body.appendChild(w);w.showModal();
    const done=v=>{w.close();w.remove();res(v)};
    w.addEventListener('cancel',()=>done(false));
    w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>done(b.dataset.a==='1'));
  });
}

/* ============ sample data ============ */
async function seed(){
  if(hasAny()){toast('มีข้อมูลอยู่แล้ว');return}
  toast('กำลังโหลดข้อมูลตัวอย่าง…');
  const M=(name,role)=>({id:uid(),name,role});
  const mem=[M('BA Team','ba'),M('Dev Team','dev'),M('Tester','tester'),M('Support','support'),M('PM','pm')];
  const P=(code,name,owner)=>({id:uid(),code,name,owner,desc:''});
  const projs=[
    P('DMS-2026','DMS AI Digital Health','Dev Team'),
    P('KM-2026','KM Platform','BA Team'),
    P('ECS-2026','Enterprise Content System','Dev Team'),
    P('SSO-2026','SSO','PM')];
  const T={
    Bug:['ไม่สามารถ Upload PDF ได้','ข้อมูลแสดงผิดหมวดหมู่','ปุ่มบันทึกกดแล้วไม่ตอบสนอง','รายงานสรุปยอดไม่ตรงกับข้อมูลจริง','ระบบค้างเมื่อค้นหาข้อมูลจำนวนมาก','แสดงวันที่ผิดรูปแบบ','ไฟล์แนบเปิดไม่ได้บนมือถือ','Export Excel ได้ไฟล์ว่าง','Session หลุดระหว่างกรอกฟอร์ม','รูปโปรไฟล์อัปโหลดแล้วไม่แสดง'],
    Issue:['User ไม่สามารถ Login ได้','ขอสิทธิ์เข้าถึงเมนูรายงาน','ระบบส่งอีเมลแจ้งเตือนช้ากว่าปกติ','ผู้ใช้ลืมรหัสผ่าน ขอ reset','สอบถามวิธีใช้งานเมนูค้นหา','ข้อมูลเก่าก่อนปี 2024 ค้นหาไม่เจอ','ขอเพิ่มผู้ใช้งานใหม่ 5 คน','ขอกู้คืนเอกสารที่ลบผิด'],
    CR:['เพิ่ม Filter หมวดหมู่','เพิ่มการส่งออกรายงานเป็น PDF','ปรับหน้าจอ Dashboard ให้แสดงกราฟ','เพิ่ม Single Sign-On กับระบบกลาง','ปรับ Workflow การอนุมัติเอกสาร','เพิ่มการแจ้งเตือนผ่าน LINE','เพิ่มช่องค้นหาแบบขั้นสูง']};
  const pri=['critical','high','high','medium','medium','medium','low'];
  const st=['open','progress','progress','resolved','closed','closed','open'];
  const envs=['DEV','UAT','PROD','UAT'];
  const yr=new Date().getFullYear();
  const counters={};
  const mk=(type,y,pi,k)=>{
    const pre=TYPES[type].pre+'-'+y+'-';
    counters[pre]=(counters[pre]||0)+1;
    const pool=T[type];
    const day=((k*7)%27)+1, mon=((k*5)%12)+1;
    const d=v=>y+'-'+String(mon).padStart(2,'0')+'-'+String(Math.min(day+v,28)).padStart(2,'0');
    const status=st[k%st.length];
    return {id:uid(),code:pre+String(counters[pre]).padStart(5,'0'),type,projectId:projs[pi].id,
      title:pool[k%pool.length],desc:'',priority:pri[k%pri.length],status,
      assigneeId:mem[type==='CR'?0:type==='Issue'?3:1].id,env:envs[k%envs.length],
      created:d(0),due:d(9)};
  };
  const issues=[];let k=0;
  /* ปีเก่าใส่น้อยลง ให้กราฟ Trend เห็นแนวโน้มชัด */
  const plan=[[yr-2,10],[yr-1,18],[yr,26]];
  for(const [y,n] of plan)for(let j=0;j<n;j++){
    const type=TKEYS[j%3==0?0:j%3==1?1:2];
    issues.push(mk(type,y,j%projs.length,k++));
  }
  if(!DB){S.members=mem;S.projects=projs;S.issues=issues;saveLocal();render();toast('โหลดข้อมูลตัวอย่างแล้ว');return}
  try{
    const jobs=[...mem.map(x=>['members',x]),...projs.map(x=>['projects',x]),...issues.map(x=>['issues',x])];
    for(let i=0;i<jobs.length;i+=6)await Promise.all(jobs.slice(i,i+6).map(([c,o])=>put(c,o)));
    toast('โหลดข้อมูลตัวอย่างแล้ว');
  }catch(e){}
}

function showAuth(show){
  $('#authScreen').hidden=!show;
  document.body.classList.toggle('locked',show);
  if(show)setTimeout(()=>{const e=$('#authEmail');e&&e.focus()},50);
}
function authMsg(text,isErr){
  const el=$('#authMsg');el.textContent=text||'';el.classList.toggle('err',!!isErr);
}
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!SB)return;
  const btn=$('#authBtn'),email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  if(!email||!pass)return;
  btn.disabled=true;authMsg('กำลังเข้าสู่ระบบ…');
  const {error}=await SB.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;
  if(error){
    authMsg(/Invalid login/i.test(error.message||'')?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':(error.message||'เข้าสู่ระบบไม่สำเร็จ'),true);
    return;
  }
  authMsg('');$('#authPass').value='';
});

}
function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  try{localStorage.setItem(THEME_LS,next)}catch(e){}
  applyTheme(next);
}
$('#themeBtn').onclick=toggleTheme;
(function(){
  let saved='light';
  try{saved=localStorage.getItem(THEME_LS)==='dark'?'dark':'light'}catch(e){}
  applyTheme(saved);
})();

/* ============ boot ============ */
loadLocal();render();
document.addEventListener('DOMContentLoaded',mountCharts);


/* เปิดผ่าน GitHub Pages / เซิร์ฟเวอร์ทั่วไป: ใช้ Supabase เมื่อกรอก config ไว้
   ต้อง login ก่อนเสมอ เพราะหน้าเว็บเปิดสาธารณะและ anon key อยู่ในโค้ด */
document.addEventListener('DOMContentLoaded',()=>{
  if(!SUPA_URL||!SUPA_KEY)return;
  if(inArtifact())return;   /* อยู่บน claude.ai ใช้ฐานข้อมูลของ artifact แทน */
  if(!window.supabase||typeof window.supabase.createClient!=='function'){
    toast('โหลดไลบรารี Supabase ไม่สำเร็จ ใช้ข้อมูลในเครื่องนี้ชั่วคราว');return;
  }
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  loaded=false;
  COLS.forEach(c=>S[c]=[]);
  render();

  SB.auth.getSession().then(({data})=>{
    if(data&&data.session)return;      /* onAuthStateChange จะจัดการต่อเอง */
    showAuth(true);
  });

  SB.auth.onAuthStateChange((event,session)=>{
    if(session&&session.user){
      setSignedIn(session.user);
      sbLoadAll();
      subscribeRealtime();
    }else{
      setSignedOut();
    }
  });
});

let sbChannel=null;
function subscribeRealtime(){
  if(!SB||sbChannel)return;          /* สมัครครั้งเดียวต่อการ login */
  sbChannel=SB.channel('issue-tracker');
  for(const col of COLS){
    sbChannel.on('postgres_changes',{event:'*',schema:'public',table:col},()=>{
      sbLoad(col).then(ok=>{if(ok)render()});
    });
  }
  sbChannel.subscribe();
}

/* เปิดเป็น Claude artifact: ใช้ฐานข้อมูลของ artifact แทน ไม่ต้อง login ซ้ำ */
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const st=$('#store');
  st.querySelector('span').textContent='กำลังเชื่อมต่อฐานข้อมูล…';

  claude.use('user').then(u=>{
    if(!u)return;
    const me=u.me&&u.me();
    Promise.resolve(me).then(p=>{
      const name=(p&&p.name)||'';
      if(!name)return;
      $('#userName').textContent=name;
      $('#userAvatar').textContent=name.trim().charAt(0).toUpperCase();
    }).catch(()=>{});
  }).catch(()=>{});

  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){st.querySelector('span').textContent='บันทึกในเบราว์เซอร์นี้';return}
  DB=db;loaded=false;COLS.forEach(c=>S[c]=[]);render();
  const got=new Set();
  for(const col of COLS){
    db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      got.add(col);if(got.size===COLS.length)loaded=true;
      render();
    },e=>toast('โหลดข้อมูลไม่สำเร็จ รีเฟรชหน้าเพื่อลองใหม่'));
  }
  st.classList.add('live');
  st.querySelector('span').textContent='บันทึกออนไลน์ ทุกคนเห็นข้อมูลชุดเดียวกัน';
})();
</script>
